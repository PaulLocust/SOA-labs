openapi: 3.0.3
info:
  title: Flat Collection Service
  version: "1.0.0"
  description: |
    Сервис для работы с коллекцией квартир (Flat).

    Все параметры передаются в URL запроса, тело запроса не используется. Ответы приходят в формате XML.

    Поле `house` у квартиры необязательное. Если передан хотя бы один из параметров `houseName`, `houseYear`,
    `houseNumberOfFlatsOnFloor`, `houseNumberOfLifts`, то нужно передать их все, иначе сервис вернёт 400.
    Параметр `houseNumberOfFloors` можно не передавать.
servers:
  - url: http://localhost:8080/api
    description: Первый сервис (Flats)

tags:
  - name: Flats
    description: Базовые CRUD-операции над коллекцией квартир
  - name: Special Operations
    description: Специальные операции над коллекцией

paths:
  /flats:
    get:
      tags: [Flats]
      operationId: getFlats
      summary: Получить список квартир
      description: |
        Возвращает список квартир с фильтрацией, сортировкой и разбиением на страницы.
        Фильтровать можно по любым полям, все фильтры необязательные. Если передано несколько фильтров,
        квартира должна подходить под каждый из них.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterName'
        - $ref: '#/components/parameters/FilterCoordinatesX'
        - $ref: '#/components/parameters/FilterCoordinatesY'
        - $ref: '#/components/parameters/FilterCreationDateFrom'
        - $ref: '#/components/parameters/FilterCreationDateTo'
        - $ref: '#/components/parameters/FilterAreaMin'
        - $ref: '#/components/parameters/FilterAreaMax'
        - $ref: '#/components/parameters/FilterPriceMin'
        - $ref: '#/components/parameters/FilterPriceMax'
        - $ref: '#/components/parameters/FilterBalcony'
        - $ref: '#/components/parameters/FilterNumberOfRoomsMin'
        - $ref: '#/components/parameters/FilterNumberOfRoomsMax'
        - $ref: '#/components/parameters/FilterFurnish'
        - $ref: '#/components/parameters/FilterView'
        - $ref: '#/components/parameters/FilterTransport'
        - $ref: '#/components/parameters/FilterHouseName'
        - $ref: '#/components/parameters/FilterHouseYearMin'
        - $ref: '#/components/parameters/FilterHouseYearMax'
        - $ref: '#/components/parameters/FilterHouseNumberOfFloors'
        - $ref: '#/components/parameters/FilterHouseNumberOfFlatsOnFloor'
        - $ref: '#/components/parameters/FilterHouseNumberOfLifts'
      responses:
        '200':
          description: Страница со списком квартир (может быть пустой)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FlatPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          description: Некорректный диапазон фильтра (например, areaMin больше areaMax)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example: |
                <error>
                  <timestamp>2026-09-25T12:00:00Z</timestamp>
                  <status>422</status>
                  <error>Unprocessable Entity</error>
                  <message>areaMin must not be greater than areaMax</message>
                  <path>/api/flats</path>
                </error>
    post:
      tags: [Flats]
      operationId: createFlat
      summary: Добавить квартиру
      description: Создаёт новую квартиру. Поля `id` и `creationDate` заполняются на сервере.
      parameters:
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/CoordinatesX'
        - $ref: '#/components/parameters/CoordinatesY'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/Price'
        - $ref: '#/components/parameters/Balcony'
        - $ref: '#/components/parameters/NumberOfRooms'
        - $ref: '#/components/parameters/Furnish'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Transport'
        - $ref: '#/components/parameters/HouseName'
        - $ref: '#/components/parameters/HouseYear'
        - $ref: '#/components/parameters/HouseNumberOfFloors'
        - $ref: '#/components/parameters/HouseNumberOfFlatsOnFloor'
        - $ref: '#/components/parameters/HouseNumberOfLifts'
      responses:
        '201':
          description: Квартира создана
          headers:
            Location:
              description: Адрес созданной квартиры
              schema:
                type: string
                example: /api/flats/1
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /flats/{id}:
    parameters:
      - $ref: '#/components/parameters/FlatId'
    get:
      tags: [Flats]
      operationId: getFlatById
      summary: Получить квартиру по id
      description: Возвращает квартиру с указанным id.
      responses:
        '200':
          description: Квартира найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Flats]
      operationId: updateFlat
      summary: Обновить квартиру
      description: |
        Заменяет все поля квартиры с указанным id на переданные. Параметры такие же, как при создании.
        Поля `id` и `creationDate` не меняются.
      parameters:
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/CoordinatesX'
        - $ref: '#/components/parameters/CoordinatesY'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/Price'
        - $ref: '#/components/parameters/Balcony'
        - $ref: '#/components/parameters/NumberOfRooms'
        - $ref: '#/components/parameters/Furnish'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Transport'
        - $ref: '#/components/parameters/HouseName'
        - $ref: '#/components/parameters/HouseYear'
        - $ref: '#/components/parameters/HouseNumberOfFloors'
        - $ref: '#/components/parameters/HouseNumberOfFlatsOnFloor'
        - $ref: '#/components/parameters/HouseNumberOfLifts'
      responses:
        '201':
          description: Квартира обновлена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Flats]
      operationId: patchFlat
      summary: Частично обновить квартиру
      description: |
        Меняет только те поля квартиры, которые переданы в запросе, остальные остаются прежними.
        Нужно передать хотя бы один параметр. Поля `id` и `creationDate` не меняются.

        Если у квартиры уже есть дом, параметры `house*` можно передавать по одному. Если дома нет,
        то чтобы его добавить, нужно передать все обязательные параметры дома, как при создании.
      parameters:
        - $ref: '#/components/parameters/NameOptional'
        - $ref: '#/components/parameters/CoordinatesXOptional'
        - $ref: '#/components/parameters/CoordinatesYOptional'
        - $ref: '#/components/parameters/AreaOptional'
        - $ref: '#/components/parameters/PriceOptional'
        - $ref: '#/components/parameters/BalconyOptional'
        - $ref: '#/components/parameters/NumberOfRoomsOptional'
        - $ref: '#/components/parameters/Furnish'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/TransportOptional'
        - $ref: '#/components/parameters/HouseName'
        - $ref: '#/components/parameters/HouseYear'
        - $ref: '#/components/parameters/HouseNumberOfFloors'
        - $ref: '#/components/parameters/HouseNumberOfFlatsOnFloor'
        - $ref: '#/components/parameters/HouseNumberOfLifts'
      responses:
        '201':
          description: Квартира обновлена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Flats]
      operationId: deleteFlat
      summary: Удалить квартиру
      description: Удаляет квартиру с указанным id.
      responses:
        '204':
          description: Квартира удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /flats/by-transport/{transport}:
    delete:
      tags: [Special Operations]
      operationId: deleteFlatsByTransport
      summary: Удалить все квартиры с заданным transport
      description: |
        Удаляет все квартиры, у которых поле `transport` равно переданному значению.
        В ответе приходит количество удалённых квартир (0, если подходящих не было).
      parameters:
        - name: transport
          in: path
          required: true
          description: Значение transport
          schema:
            $ref: '#/components/schemas/Transport'
      responses:
        '200':
          description: Количество удалённых квартир
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'

  /flats/average-number-of-rooms:
    get:
      tags: [Special Operations]
      operationId: getAverageNumberOfRooms
      summary: Среднее количество комнат
      description: Считает среднее значение `numberOfRooms` по всем квартирам. Для пустой коллекции возвращает 0.
      responses:
        '200':
          description: Среднее значение
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AverageNumberOfRoomsResult'
        '406':
          $ref: '#/components/responses/NotAcceptable'

  /flats/count-by-house-greater-than:
    get:
      tags: [Special Operations]
      operationId: countFlatsByHouseGreaterThan
      summary: Количество квартир с house больше заданного
      description: |
        Возвращает количество квартир, у которых `house` больше дома, переданного в параметрах.
        Дома сравниваются сначала по `year`, при равенстве по `numberOfFlatsOnFloor`, потом по `numberOfLifts`,
        `numberOfFloors` (null меньше любого числа) и `name`. Квартиры без дома не учитываются.
      parameters:
        - $ref: '#/components/parameters/HouseNameRequired'
        - $ref: '#/components/parameters/HouseYearRequired'
        - $ref: '#/components/parameters/HouseNumberOfFloors'
        - $ref: '#/components/parameters/HouseNumberOfFlatsOnFloorRequired'
        - $ref: '#/components/parameters/HouseNumberOfLiftsRequired'
      responses:
        '200':
          description: Количество квартир
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    FlatId:
      name: id
      in: path
      required: true
      description: id квартиры, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1

    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: Номер страницы, начиная с 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Количество квартир на странице
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 10

    Sort:
      name: sort
      in: query
      required: false
      description: |
        Сортировка в формате `поле,asc` или `поле,desc`. Можно указать несколько раз,
        например `sort=price,desc&sort=name,asc`. По умолчанию `id,asc`.

        Доступные поля: `id`, `name`, `coordinates.x`, `coordinates.y`, `creationDate`, `area`, `price`,
        `balcony`, `numberOfRooms`, `furnish`, `view`, `transport`, `house.name`, `house.year`,
        `house.numberOfFloors`, `house.numberOfFlatsOnFloor`, `house.numberOfLifts`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: price,desc

    Name:
      name: name
      in: query
      required: true
      description: Название квартиры, не пустое
      schema:
        type: string
        minLength: 1
    CoordinatesX:
      name: coordinatesX
      in: query
      required: true
      description: Координата x, не больше 607
      schema:
        type: number
        format: double
        maximum: 607
    CoordinatesY:
      name: coordinatesY
      in: query
      required: true
      description: Координата y, больше -560
      schema:
        type: number
        format: float
        minimum: -560
        exclusiveMinimum: true
    Area:
      name: area
      in: query
      required: true
      description: Площадь, от 1 до 982
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 982
    Price:
      name: price
      in: query
      required: true
      description: Цена, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    Balcony:
      name: balcony
      in: query
      required: true
      description: Есть ли балкон
      schema:
        type: boolean
    NumberOfRooms:
      name: numberOfRooms
      in: query
      required: true
      description: Количество комнат, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    Furnish:
      name: furnish
      in: query
      required: false
      description: Отделка
      schema:
        $ref: '#/components/schemas/Furnish'
    View:
      name: view
      in: query
      required: false
      description: Вид из окна
      schema:
        $ref: '#/components/schemas/View'
    Transport:
      name: transport
      in: query
      required: true
      description: Транспортная доступность
      schema:
        $ref: '#/components/schemas/Transport'
    HouseName:
      name: houseName
      in: query
      required: false
      description: Название дома
      schema:
        type: string
        minLength: 1
    HouseYear:
      name: houseYear
      in: query
      required: false
      description: Год постройки дома, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    HouseNumberOfFloors:
      name: houseNumberOfFloors
      in: query
      required: false
      description: Количество этажей в доме, больше 0. Можно не передавать
      schema:
        type: integer
        format: int64
        minimum: 1
    HouseNumberOfFlatsOnFloor:
      name: houseNumberOfFlatsOnFloor
      in: query
      required: false
      description: Количество квартир на этаже, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    HouseNumberOfLifts:
      name: houseNumberOfLifts
      in: query
      required: false
      description: Количество лифтов, больше 0
      schema:
        type: integer
        format: int32
        minimum: 1

    NameOptional:
      name: name
      in: query
      required: false
      description: Название квартиры, не пустое
      schema:
        type: string
        minLength: 1
    CoordinatesXOptional:
      name: coordinatesX
      in: query
      required: false
      description: Координата x, не больше 607
      schema:
        type: number
        format: double
        maximum: 607
    CoordinatesYOptional:
      name: coordinatesY
      in: query
      required: false
      description: Координата y, больше -560
      schema:
        type: number
        format: float
        minimum: -560
        exclusiveMinimum: true
    AreaOptional:
      name: area
      in: query
      required: false
      description: Площадь, от 1 до 982
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 982
    PriceOptional:
      name: price
      in: query
      required: false
      description: Цена, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    BalconyOptional:
      name: balcony
      in: query
      required: false
      description: Есть ли балкон
      schema:
        type: boolean
    NumberOfRoomsOptional:
      name: numberOfRooms
      in: query
      required: false
      description: Количество комнат, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    TransportOptional:
      name: transport
      in: query
      required: false
      description: Транспортная доступность
      schema:
        $ref: '#/components/schemas/Transport'

    HouseNameRequired:
      name: houseName
      in: query
      required: true
      description: Название дома
      schema:
        type: string
        minLength: 1
    HouseYearRequired:
      name: houseYear
      in: query
      required: true
      description: Год постройки дома, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    HouseNumberOfFlatsOnFloorRequired:
      name: houseNumberOfFlatsOnFloor
      in: query
      required: true
      description: Количество квартир на этаже, больше 0
      schema:
        type: integer
        format: int64
        minimum: 1
    HouseNumberOfLiftsRequired:
      name: houseNumberOfLifts
      in: query
      required: true
      description: Количество лифтов, больше 0
      schema:
        type: integer
        format: int32
        minimum: 1

    FilterId:
      name: id
      in: query
      required: false
      description: id квартиры
      schema:
        type: integer
        format: int64
    FilterName:
      name: name
      in: query
      required: false
      description: Название квартиры
      schema:
        type: string
    FilterCoordinatesX:
      name: coordinatesX
      in: query
      required: false
      description: Координата x
      schema:
        type: number
        format: double
    FilterCoordinatesY:
      name: coordinatesY
      in: query
      required: false
      description: Координата y
      schema:
        type: number
        format: float
    FilterCreationDateFrom:
      name: creationDateFrom
      in: query
      required: false
      description: Дата создания, от (включительно)
      schema:
        type: string
        format: date-time
    FilterCreationDateTo:
      name: creationDateTo
      in: query
      required: false
      description: Дата создания, до (включительно)
      schema:
        type: string
        format: date-time
    FilterAreaMin:
      name: areaMin
      in: query
      required: false
      description: Площадь, от (включительно)
      schema:
        type: integer
        format: int64
    FilterAreaMax:
      name: areaMax
      in: query
      required: false
      description: Площадь, до (включительно)
      schema:
        type: integer
        format: int64
    FilterPriceMin:
      name: priceMin
      in: query
      required: false
      description: Цена, от (включительно)
      schema:
        type: integer
        format: int64
    FilterPriceMax:
      name: priceMax
      in: query
      required: false
      description: Цена, до (включительно)
      schema:
        type: integer
        format: int64
    FilterBalcony:
      name: balcony
      in: query
      required: false
      description: Есть ли балкон
      schema:
        type: boolean
    FilterNumberOfRoomsMin:
      name: numberOfRoomsMin
      in: query
      required: false
      description: Количество комнат, от (включительно)
      schema:
        type: integer
        format: int64
    FilterNumberOfRoomsMax:
      name: numberOfRoomsMax
      in: query
      required: false
      description: Количество комнат, до (включительно)
      schema:
        type: integer
        format: int64
    FilterFurnish:
      name: furnish
      in: query
      required: false
      description: Отделка
      schema:
        $ref: '#/components/schemas/Furnish'
    FilterView:
      name: view
      in: query
      required: false
      description: Вид из окна
      schema:
        $ref: '#/components/schemas/View'
    FilterTransport:
      name: transport
      in: query
      required: false
      description: Транспортная доступность
      schema:
        $ref: '#/components/schemas/Transport'
    FilterHouseName:
      name: houseName
      in: query
      required: false
      description: Название дома
      schema:
        type: string
    FilterHouseYearMin:
      name: houseYearMin
      in: query
      required: false
      description: Год постройки дома, от (включительно)
      schema:
        type: integer
        format: int64
    FilterHouseYearMax:
      name: houseYearMax
      in: query
      required: false
      description: Год постройки дома, до (включительно)
      schema:
        type: integer
        format: int64
    FilterHouseNumberOfFloors:
      name: houseNumberOfFloors
      in: query
      required: false
      description: Количество этажей в доме
      schema:
        type: integer
        format: int64
    FilterHouseNumberOfFlatsOnFloor:
      name: houseNumberOfFlatsOnFloor
      in: query
      required: false
      description: Количество квартир на этаже
      schema:
        type: integer
        format: int64
    FilterHouseNumberOfLifts:
      name: houseNumberOfLifts
      in: query
      required: false
      description: Количество лифтов
      schema:
        type: integer
        format: int32

  schemas:
    Furnish:
      type: string
      description: Отделка
      enum: [DESIGNER, NONE, BAD, LITTLE]
      xml:
        name: furnish
    View:
      type: string
      description: Вид из окна
      enum: [YARD, BAD, NORMAL, GOOD, TERRIBLE]
      xml:
        name: view
    Transport:
      type: string
      description: Транспортная доступность
      enum: [FEW, NONE, ENOUGH]
      xml:
        name: transport

    Coordinates:
      type: object
      description: Координаты
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          maximum: 607
          description: Не больше 607
        y:
          type: number
          format: float
          minimum: -560
          exclusiveMinimum: true
          description: Больше -560
      xml:
        name: coordinates

    House:
      type: object
      description: Дом
      required: [name, year, numberOfFlatsOnFloor, numberOfLifts]
      properties:
        name:
          type: string
          minLength: 1
        year:
          type: integer
          format: int64
          minimum: 1
          description: Больше 0
        numberOfFloors:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Больше 0, может быть null
        numberOfFlatsOnFloor:
          type: integer
          format: int64
          minimum: 1
          description: Больше 0
        numberOfLifts:
          type: integer
          format: int32
          minimum: 1
          description: Больше 0
      xml:
        name: house

    Flat:
      type: object
      description: Квартира
      required: [id, name, coordinates, creationDate, area, price, balcony, numberOfRooms, transport]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Генерируется автоматически
        name:
          type: string
          minLength: 1
          description: Не может быть пустым
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
          description: Генерируется автоматически
        area:
          type: integer
          format: int64
          minimum: 1
          maximum: 982
          description: От 1 до 982
        price:
          type: integer
          format: int64
          minimum: 1
          description: Больше 0
        balcony:
          type: boolean
          description: Есть ли балкон
        numberOfRooms:
          type: integer
          format: int64
          minimum: 1
          description: Больше 0
        furnish:
          allOf:
            - $ref: '#/components/schemas/Furnish'
          nullable: true
          description: Может быть null
        view:
          allOf:
            - $ref: '#/components/schemas/View'
          nullable: true
          description: Может быть null
        transport:
          $ref: '#/components/schemas/Transport'
        house:
          allOf:
            - $ref: '#/components/schemas/House'
          nullable: true
          description: Может быть null
      xml:
        name: flat

    FlatPage:
      type: object
      description: Страница со списком квартир
      properties:
        pageNumber:
          type: integer
          format: int32
          description: Номер страницы
        pageSize:
          type: integer
          format: int32
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          description: Сколько всего квартир подходит под фильтры
        totalPages:
          type: integer
          format: int32
          description: Сколько всего страниц
        items:
          type: array
          items:
            $ref: '#/components/schemas/Flat'
          xml:
            name: flat
            wrapped: false
      xml:
        name: flatPage

    DeletionResult:
      type: object
      properties:
        deletedCount:
          type: integer
          format: int64
          description: Сколько квартир удалено
      xml:
        name: deletionResult

    AverageNumberOfRoomsResult:
      type: object
      properties:
        average:
          type: number
          format: double
          description: Среднее количество комнат
      xml:
        name: averageNumberOfRoomsResult

    CountResult:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: Количество квартир
      xml:
        name: countResult

    Error:
      type: object
      description: Ошибка
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Required parameter 'name' is missing
        path:
          type: string
          example: /api/flats
      xml:
        name: error

  responses:
    BadRequest:
      description: Некорректный запрос (не передан обязательный параметр, неверный тип или формат значения)
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>400</status>
              <error>Bad Request</error>
              <message>Parameter 'area' must be an integer</message>
              <path>/api/flats</path>
            </error>
    NotFound:
      description: Квартира с таким id не найдена
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>404</status>
              <error>Not Found</error>
              <message>Flat with id 42 not found</message>
              <path>/api/flats/42</path>
            </error>
    NotAcceptable:
      description: Клиент запросил формат ответа, отличный от XML (заголовок Accept)
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>406</status>
              <error>Not Acceptable</error>
              <message>Only application/xml is supported</message>
              <path>/api/flats</path>
            </error>
    UnprocessableEntity:
      description: Значения нарушают ограничения класса (например, area больше 982, пустое name или id меньше 1)
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>422</status>
              <error>Unprocessable Entity</error>
              <message>Field 'area' must be between 1 and 982</message>
              <path>/api/flats</path>
            </error>
