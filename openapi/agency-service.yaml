openapi: 3.0.3
info:
  title: Agency Service
  version: "1.0.0"
  description: |
    Сервис агентства недвижимости. Свою коллекцию не хранит, данные о квартирах берёт из первого сервиса
    (Flat Collection Service).

    Параметры передаются в пути запроса. Ответы приходят в формате XML, квартира описывается той же схемой
    `Flat`, что и в первом сервисе.
servers:
  - url: http://localhost:8081/agency
    description: Второй сервис (Agency)

tags:
  - name: Agency
    description: Операции агентства поверх первого сервиса

paths:
  /find-with-balcony/{cheapest}/{with-balcony}:
    get:
      tags: [Agency]
      operationId: findWithBalcony
      summary: Найти самую дешёвую или самую дорогую квартиру с балконом или без
      description: |
        Ищет самую дешёвую (`cheapest=true`) или самую дорогую (`cheapest=false`) квартиру
        с балконом (`with-balcony=true`) или без него (`with-balcony=false`).
        Для этого вызывает `GET /flats` первого сервиса с фильтром по `balcony` и сортировкой по `price`.
      parameters:
        - name: cheapest
          in: path
          required: true
          description: true, чтобы искать самую дешёвую квартиру, false, чтобы самую дорогую
          schema:
            type: boolean
        - name: with-balcony
          in: path
          required: true
          description: true, чтобы искать квартиру с балконом, false, чтобы без балкона
          schema:
            type: boolean
      responses:
        '200':
          description: Найденная квартира
          content:
            application/xml:
              schema:
                $ref: 'flats-service.yaml#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Подходящих квартир нет
          content:
            application/xml:
              schema:
                $ref: 'flats-service.yaml#/components/schemas/Error'
              example: |
                <error>
                  <timestamp>2026-09-25T12:00:00Z</timestamp>
                  <status>404</status>
                  <error>Not Found</error>
                  <message>No flats with balcony found</message>
                  <path>/agency/find-with-balcony/true/true</path>
                </error>
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /get-most-expensive/{id1}/{id2}/{id3}:
    get:
      tags: [Agency]
      operationId: getMostExpensiveOfThree
      summary: Выбрать самую дорогую из трёх квартир
      description: |
        Получает из первого сервиса квартиры с id `id1`, `id2`, `id3` (через `GET /flats/{id}`)
        и возвращает ту, у которой больше `price`. Все три id должны быть разными.
      parameters:
        - name: id1
          in: path
          required: true
          description: id первой квартиры
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: id2
          in: path
          required: true
          description: id второй квартиры
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: id3
          in: path
          required: true
          description: id третьей квартиры
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Самая дорогая из трёх квартир
          content:
            application/xml:
              schema:
                $ref: 'flats-service.yaml#/components/schemas/Flat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Хотя бы одна из квартир не найдена
          content:
            application/xml:
              schema:
                $ref: 'flats-service.yaml#/components/schemas/Error'
              example: |
                <error>
                  <timestamp>2026-09-25T12:00:00Z</timestamp>
                  <status>404</status>
                  <error>Not Found</error>
                  <message>Flat with id 3 not found</message>
                  <path>/agency/get-most-expensive/1/2/3</path>
                </error>
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  responses:
    BadRequest:
      description: Некорректный синтаксис параметров пути (например, передана строка вместо числа или boolean)
      content:
        application/xml:
          schema:
            $ref: 'flats-service.yaml#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>400</status>
              <error>Bad Request</error>
              <message>Parameter 'cheapest' must be a boolean</message>
              <path>/agency/find-with-balcony/not-a-bool/true</path>
            </error>
    NotAcceptable:
      description: Клиент запросил формат ответа, отличный от XML (заголовок Accept)
      content:
        application/xml:
          schema:
            $ref: 'flats-service.yaml#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>406</status>
              <error>Not Acceptable</error>
              <message>Only application/xml is supported</message>
              <path>/agency/get-most-expensive/1/2/3</path>
            </error>
    UnprocessableEntity:
      description: Семантическая ошибка параметров (например, id меньше 1 или среди id есть совпадающие)
      content:
        application/xml:
          schema:
            $ref: 'flats-service.yaml#/components/schemas/Error'
          example: |
            <error>
              <timestamp>2026-09-25T12:00:00Z</timestamp>
              <status>422</status>
              <error>Unprocessable Entity</error>
              <message>id1, id2 and id3 must be different</message>
              <path>/agency/get-most-expensive/1/1/3</path>
            </error>