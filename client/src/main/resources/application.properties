spring.application.name=soa-client

# Клиент тоже доступен только по HTTPS (самоподписанный сертификат).
# Значения переопределяются переменными окружения или аргументами --server.port=... при запуске.
server.port=${CLIENT_PORT:8445}
server.ssl.enabled=true
server.ssl.key-store=${CLIENT_KEYSTORE:keystore/client.p12}
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12

services.flats-origin=${FLATS_ORIGIN:https://localhost:8443}
services.agency-origin=${AGENCY_ORIGIN:https://localhost:8444}
services.truststore=${CLIENT_TRUSTSTORE:keystore/client-truststore.p12}
services.truststore-password=${KEYSTORE_PASSWORD:changeit}

spring.main.banner-mode=off
